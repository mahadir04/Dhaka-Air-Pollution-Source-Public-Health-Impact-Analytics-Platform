name: CI Pipeline

on:
  push:
    branches: [ "mahadir", "main", "master" ]
  pull_request:
    branches: [ "mahadir", "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Python Syntax & AST
      run: |
        python -c "
        import py_compile, glob
        files = glob.glob('**/*.py', recursive=True)
        files = [f for f in files if not f.startswith('.venv')]
        for f in files:
            py_compile.compile(f, doraise=True)
            print(f'✓ Compiled {f}')
        "

    - name: Verify Model Artifact
      run: |
        python -c "
        import joblib, json
        from pathlib import Path
        if Path('dhaka_pm25_model.joblib').exists():
            art = joblib.load('dhaka_pm25_model.joblib')
            print('✓ Model loaded:', art['target'], '| R2:', art['metrics']['r2'])
        "
